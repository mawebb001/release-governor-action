name: action-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  action-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Guard action.yml and run the evidence gate table
        run: node scripts/check-action.mjs
