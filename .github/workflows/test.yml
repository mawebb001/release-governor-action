# Tests for the action itself: static validation, the credential-boundary
# proofs (placeholders + stubs, offline), and one network-backed proof that the
# committed lockfile installs the exact CLI on a clean runner. No secrets are
# used anywhere in this workflow.
name: Action tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Static validation + defensive dynamic tests (placeholders only, offline)
        run: bash tests/run.sh

      - name: Locked CLI install on a clean runner (registry only, no credentials)
        run: |
          export GITHUB_ACTION_PATH="$GITHUB_WORKSPACE"
          bash scripts/install-deps.sh cli
          "$GITHUB_WORKSPACE/deps/cli/node_modules/.bin/enterprise-skills" --version
