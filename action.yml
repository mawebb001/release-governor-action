name: "Enterprise Skills Release Governor"
description: >-
  Deterministic, evidence-bound PASS/FAIL on pull requests. Installs the
  Enterprise Skills CLI, runs the optional headless evidence phase, and posts
  the decision that completes the enterprise-skills/release-governor check.
branding:
  icon: "shield"
  color: "blue"

inputs:
  license-key:
    description: >-
      Enterprise Skills license key (store as a repository secret — mint a
      dedicated CI service key with `enterprise-skills license mint-ci` rather
      than reusing a workstation key). Rides as ES_LICENSE_KEY env only on the
      license compatibility step and the govern step, not on an evidence step
      where an agent runs. On an installed CLI >= 4.14 the action writes no
      license file; below 4.14 it plants the keys-only
      ~/.enterprise-skills/license.json those versions read. The evidence
      phase is refused while a license file exists in the runner's home; the
      govern step then runs and the job fails.
    required: true
  anthropic-api-key:
    description: >-
      Optional. Funds the headless evidence phase (semantic domain agents).
      Both evidence steps pass --pass-env ANTHROPIC_API_KEY: cli 4.31.0 hands
      the agent an allowlisted environment, and the key is in it because the
      flag names it (without the flag, no credential-like name is in it). The
      agent runs as the same OS user as the CLI, so it can read the CLI
      process's environment, which holds the key with or without the flag.
      The flag needs an installed cli >= 4.31.0; on an older or pre-release
      CLI the evidence phase is refused with an error, the govern step runs,
      and the job then fails.
      Without it the evidence phase is skipped with a visible notice and the
      Governor decides over whatever evidence is committed — which, in enforce
      mode, is an honest FAIL on evidence-requiring diffs, not a bug. Consider
      mode: warn in .project-ai/GOVERNOR_POLICY.yaml while unfunded.
    required: false
    default: ""
  evidence:
    description: >-
      Evidence phase: "agents" (PR-scale semantic agents — minutes),
      "release-readiness" (the full orchestrated workflow — up to 90 minutes),
      or "none". Runs only when the installed cli is a plain release >= 4.31.0
      and no license file exists in the runner's home. When an evidence step
      fails or is refused, or this input is none of those three values, the
      govern step runs and the job then fails.
    required: false
    default: "agents"
  cli-version:
    description: >-
      enterprise-skills npm version (4.31.0) or semver range (^4.31.0,
      >=4.31.0 <5.0.0). Anything else, such as a dist-tag or an npm: alias,
      fails the job before anything is installed. The evidence phase runs only
      when the installed CLI is a plain release >= 4.31.0; on an older release
      the govern step still runs, and when the evidence phase was asked for and
      funded the job then fails. When the installed CLI cannot report its
      version, the job fails before the govern step.
    required: false
    # Verified artifact: enterprise-skills@4.31.0
    # dist.integrity sha512-pQSF/GFSJLXgh7ZR4dOJVfUtlYhPubrq8oQ39Bsn/79MxLmxmb51NpMaGzDhCd4nYoCL/fXYPgk2aXHJ/NBXXQ==
    # gitHead 3be3bb1cd4542462bd4f965c98c71696fe75edf7
    # This default moves only by an owner release decision (scripts/pins.mjs).
    default: "4.31.0"

# Each step below is checked, command line by command line, by
# scripts/check-action.mjs: a change here needs the same change there.
runs:
  using: "composite"
  steps:
    # cli-version reaches the shell only through env, and only after it is
    # validated as an npm version or semver range.
    - name: Install Enterprise Skills CLI
      shell: bash
      env:
        ES_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/cli-version.mjs"
        npm install -g "enterprise-skills@$ES_CLI_VERSION"

    # The one read of the installed version; later steps use its
    # outputs. An unreadable version fails the job here, before govern. A
    # readable one older than 4.31.0, or a pre-release, refuses the evidence
    # phase (4.30.2, the release before 4.31.0, rejects --pass-env and,
    # without it, hands the agent the step's whole environment); govern still
    # runs, and when the phase was asked for and funded, the last step fails
    # the job.
    - name: Installed CLI version and evidence gate
      id: cli
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
        FUNDED: ${{ inputs.anthropic-api-key != '' }}
      run: |
        if ES_VERSION_OUT="$(enterprise-skills --version)"; then ES_VERSION_RC=0; else ES_VERSION_RC=$?; fi
        export ES_VERSION_OUT ES_VERSION_RC
        node "$GITHUB_ACTION_PATH/scripts/evidence-gate.mjs"

    # The license rides as env on this step and the govern step only (never
    # on an evidence step, where an agent runs). Releases below 4.14 read only
    # ~/.enterprise-skills/license.json, so for those the keys-only file is
    # planted (planted, never device-activated — device seats are for
    # workstations and an ephemeral runner would burn one per run).
    - name: License compatibility (plant the file only for cli < 4.14)
      shell: bash
      env:
        ES_LICENSE_KEY: ${{ inputs.license-key }}
        ES_CLI_INSTALLED: ${{ steps.cli.outputs.version }}
        PLANT_LICENSE_FILE: ${{ steps.cli.outputs.plant-license-file }}
      run: |
        if [ "$PLANT_LICENSE_FILE" = "true" ]; then
          mkdir -p ~/.enterprise-skills
          node -e "require('fs').writeFileSync(require('os').homedir()+'/.enterprise-skills/license.json', JSON.stringify({ key: process.env.ES_LICENSE_KEY }))"
          echo "cli $ES_CLI_INSTALLED predates env-first ES_LICENSE_KEY (4.14.0): planted the keys-only license file it reads."
        else
          echo "cli $ES_CLI_INSTALLED resolves ES_LICENSE_KEY from the environment: no license file written."
        fi

    # Installed in a step that sets neither key, and only when an evidence
    # step could run. A failure here, or in an evidence step, does not stop
    # the govern step; the last step fails the job.
    - name: Install Claude Code (evidence phase)
      id: claude-code
      if: ${{ steps.cli.outputs.evidence == 'agents' || steps.cli.outputs.evidence == 'release-readiness' }}
      continue-on-error: true
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.285

    # The last step before an evidence step. The CLI passes HOME to the agent,
    # so a license file in the runner's home is readable by the agent whoever
    # put it there (the install above included): refuse the evidence phase.
    - name: License file check (refuse the evidence phase next to a license file)
      id: license-file
      if: ${{ steps.cli.outputs.evidence == 'agents' || steps.cli.outputs.evidence == 'release-readiness' }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/license-file-check.mjs"

    - name: Evidence phase (semantic agents)
      id: agents
      if: ${{ steps.cli.outputs.evidence == 'agents' && steps.claude-code.outcome == 'success' && steps.license-file.outputs.clear == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE_REF: ${{ github.base_ref }}
      run: enterprise-skills agents run --yes --base "origin/$BASE_REF" --pass-env ANTHROPIC_API_KEY --agent-cmd "claude -p \"{prompt}\" --permission-mode acceptEdits"

    - name: Evidence phase (full release-readiness workflow)
      id: release-readiness
      if: ${{ steps.cli.outputs.evidence == 'release-readiness' && steps.claude-code.outcome == 'success' && steps.license-file.outputs.clear == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: enterprise-skills orchestrate workflow run release-readiness --yes --pass-env ANTHROPIC_API_KEY --agent-cmd "claude -p \"{prompt}\" --permission-mode acceptEdits" --step-timeout 1800

    - name: Evidence phase skipped (unfunded)
      if: ${{ inputs.anthropic-api-key == '' && inputs.evidence != 'none' }}
      shell: bash
      run: |
        echo "::notice title=Evidence phase skipped::No anthropic-api-key input was provided, so no headless evidence was produced. The Governor decides over committed evidence only. On evidence-requiring diffs in enforce mode that is an honest FAIL — the policy working, not a bug. Fund the evidence phase, commit session evidence, or set mode: warn in .project-ai/GOVERNOR_POLICY.yaml while adopting."

    - name: Govern and post the decision (completes the PR check run)
      shell: bash
      env:
        ES_LICENSE_KEY: ${{ inputs.license-key }}
        PR_NUMBER: ${{ github.event.number }}
        BASE_REF: ${{ github.base_ref }}
      run: enterprise-skills govern --post --pr "$PR_NUMBER" --base "origin/$BASE_REF"

    # Runs after govern. Fails the job when an evidence-phase step failed, when
    # an evidence phase that was asked for and funded was refused (the CLI
    # version, or a license file), or when the evidence input is invalid.
    - name: Fail the job when the evidence phase failed or was refused
      if: ${{ steps.claude-code.outcome == 'failure' || steps.agents.outcome == 'failure' || steps.release-readiness.outcome == 'failure' || steps.cli.outputs.refused == 'true' || steps.license-file.outputs.clear == 'false' || steps.cli.outputs.evidence-input-valid == 'false' }}
      shell: bash
      env:
        CLAUDE_CODE_OUTCOME: ${{ steps.claude-code.outcome }}
        AGENTS_OUTCOME: ${{ steps.agents.outcome }}
        RELEASE_READINESS_OUTCOME: ${{ steps.release-readiness.outcome }}
        EVIDENCE_REFUSED: ${{ steps.cli.outputs.refused }}
        LICENSE_FILE_CLEAR: ${{ steps.license-file.outputs.clear }}
        EVIDENCE_INPUT_VALID: ${{ steps.cli.outputs.evidence-input-valid }}
      run: |
        if [ "$CLAUDE_CODE_OUTCOME" = "failure" ] || [ "$AGENTS_OUTCOME" = "failure" ] || [ "$RELEASE_READINESS_OUTCOME" = "failure" ]; then
          echo "::error title=Evidence phase failed::An evidence-phase step failed (its log is above). The govern step ran over the evidence that exists; this step fails the job so the failure stays visible."
        fi
        if [ "$EVIDENCE_REFUSED" = "true" ] || [ "$LICENSE_FILE_CLEAR" = "false" ]; then
          echo "::error title=Evidence phase refused::The evidence phase was asked for and funded but refused (the reason and the fix are in the error above). The govern step ran; this step fails the job so the refusal stays visible."
        fi
        if [ "$EVIDENCE_INPUT_VALID" = "false" ]; then
          echo "::error title=Invalid evidence input::The evidence input must be agents, release-readiness or none (the value is in the error above). The govern step ran; this step fails the job."
        fi
        exit 1
