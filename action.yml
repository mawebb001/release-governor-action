name: "Enterprise Skills Release Governor"
description: >-
  Deterministic, evidence-bound PASS/FAIL on every pull request. Installs the
  Enterprise Skills CLI from a committed, integrity-locked lockfile, runs the
  optional headless evidence phase only in trusted contexts, and posts the
  decision that completes the enterprise-skills/release-governor check. Every
  credential is scoped to the single step that needs it; every child process
  runs under an allowlisted environment.
branding:
  icon: "shield"
  color: "blue"

inputs:
  license-key:
    description: >-
      Enterprise Skills license key (store as a repository secret; mint a
      dedicated CI service key with `enterprise-skills license mint-ci` rather
      than reusing a workstation key). Present in exactly one step, the
      decision post, as ES_LICENSE_KEY, and passed by name to the governor
      process only. Never written to disk, never device-activated. Required:
      an empty value fails the run safely (fork pull requests, which GitHub
      never gives secrets, skip with a notice instead).
    required: true
  anthropic-api-key:
    description: >-
      Optional. Funds the headless evidence phase (semantic domain agents).
      Present in exactly one step, the evidence phase, and ONLY when the trust
      context permits AI execution (push to the default branch or a trusted
      ref, workflow_dispatch/schedule on such a ref). On pull_request,
      pull_request_target, merge_group and other branches the key is never
      exposed to any process and the Governor decides over committed evidence.
      Absent = the phase is skipped with a visible notice.
    required: false
    default: ""
  evidence:
    description: >-
      Evidence phase: "agents" (PR-scale semantic agents), "release-readiness"
      (the full orchestrated workflow, up to 90 minutes), or "none".
    required: false
    default: "agents"
  cli-version:
    description: >-
      The exact Enterprise Skills CLI version this action installs. The CLI is
      installed from the committed deps/cli/package-lock.json (exact version +
      integrity for the whole tree), never resolved from a range at run time.
      This input exists so a workflow can STATE the pin it expects; a value
      other than the locked pin fails the run. Ranges and dist-tags are
      refused.
    required: false
    default: "4.30.2"
  trusted-refs:
    description: >-
      Optional comma-separated branch names (or full refs) in addition to the
      repository default branch that count as protected/trusted for the AI
      evidence phase, e.g. "release/2026.08, main". Pull requests are never
      trusted regardless of this list.
    required: false
    default: ""
  base-ref:
    description: >-
      Optional explicit base ref for diff classification (e.g. "origin/main").
      Defaults to origin/<pull-request base> on pull_request events and to the
      push event's "before" commit on push events.
    required: false
    default: ""

outputs:
  trust:
    description: Resolved trust context (fork-pr, same-repo-pr, pr-target, merge-queue, protected-branch, branch-push, trusted-manual, manual-other-ref, unknown-event).
    value: ${{ steps.trust.outputs.trust }}
  ai-evidence:
    description: What happened to the AI evidence phase (scheduled, refused-untrusted, skipped-unfunded, disabled, not-run, refused-checkout-credentials).
    value: ${{ steps.preflight.outputs.ai_evidence }}
  outcome:
    description: Run outcome (decided, decision-failed, skipped-fork-no-license, blocked-missing-license, blocked-checkout-credentials, blocked-no-base).
    value: ${{ steps.govern.outputs.outcome || steps.preflight.outputs.outcome }}
  cli-version:
    description: The exact Enterprise Skills CLI version installed (from the committed lockfile).
    value: ${{ steps.inputs.outputs.cli_version }}

runs:
  using: "composite"
  steps:
    # ------------------------------------------------------------------------
    # Credential scope, step by step (the whole point of this file):
    #   validate / trust / preflight / install ... NO credential in env
    #   evidence ........................... ANTHROPIC_API_KEY only, trusted only
    #   govern ............................. ES_LICENSE_KEY only
    # Secrets are never interpolated into a `run:` line. Every CLI process is
    # started by scripts/lib.sh rg_scoped_exec with `env -i` + an allowlist, so
    # a job-level GITHUB_TOKEN, the OIDC request variables injected by
    # `id-token: write`, NODE_OPTIONS, npm_config_* and INPUT_* never reach an
    # installer, an agent or the governor unless a step passes them by name.
    # ------------------------------------------------------------------------
    - name: Validate inputs (no credentials in scope)
      id: inputs
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
        CLI_VERSION: ${{ inputs.cli-version }}
        TRUSTED_REFS: ${{ inputs.trusted-refs }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate-inputs.sh"

    - name: Resolve trust context (no credentials in scope)
      id: trust
      shell: bash
      env:
        TRUSTED_REFS: ${{ inputs.trusted-refs }}
      run: bash "$GITHUB_ACTION_PATH/scripts/resolve-trust.sh"

    # Presence booleans are computed by the runner's expression engine; the
    # step never holds a secret value. Fails safely when the license is absent
    # (fork PRs: notice + skip; anything else: error), refuses AI evidence in
    # untrusted contexts, and fails closed if the checkout persisted a token
    # while AI evidence would run.
    - name: Preflight (credential presence, trust gate, checkout state)
      id: preflight
      shell: bash
      env:
        LICENSE_PRESENT: ${{ inputs.license-key != '' }}
        ANTHROPIC_PRESENT: ${{ inputs.anthropic-api-key != '' }}
        EVIDENCE: ${{ inputs.evidence }}
        TRUST: ${{ steps.trust.outputs.trust }}
        AI_ALLOWED: ${{ steps.trust.outputs.ai_allowed }}
      run: bash "$GITHUB_ACTION_PATH/scripts/preflight.sh"

    # Dependency installation happens OUTSIDE credential scope: no secret on
    # these steps, npm lifecycle scripts disabled, exact versions + integrity
    # from the committed lockfiles.
    - name: Install Enterprise Skills CLI (integrity-locked, scripts disabled, no credentials)
      id: install-cli
      if: steps.preflight.outputs.proceed == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-deps.sh" cli

    - name: Install semantic-agent runtime (trusted context only, no credentials)
      id: install-agent
      if: steps.preflight.outputs.proceed == 'true' && steps.preflight.outputs.ai_run == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-deps.sh" agent

    - name: Evidence phase (trusted context only; ANTHROPIC_API_KEY is the only credential in scope)
      id: evidence
      if: steps.preflight.outputs.proceed == 'true' && steps.preflight.outputs.ai_run == 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        TRUST: ${{ steps.trust.outputs.trust }}
        AI_ALLOWED: ${{ steps.trust.outputs.ai_allowed }}
        AI_RUN: ${{ steps.preflight.outputs.ai_run }}
        EVIDENCE: ${{ inputs.evidence }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
        PUSH_BEFORE: ${{ steps.trust.outputs.push_before }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-evidence.sh"

    - name: Govern and post the decision (ES_LICENSE_KEY is the only credential in scope)
      id: govern
      if: steps.preflight.outputs.proceed == 'true'
      shell: bash
      env:
        ES_LICENSE_KEY: ${{ inputs.license-key }}
        TRUST: ${{ steps.trust.outputs.trust }}
        PR_NUMBER: ${{ steps.trust.outputs.pr_number }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
        PUSH_BEFORE: ${{ steps.trust.outputs.push_before }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-govern.sh"
